<aside class="lateral">
  <div class="tarjeta">
    <h3>Próximas juntadas</h3>
    @for (juntada of juntadas(); track juntada._id) {
      <article class="juntada">
        @let fecha = juntada.fechaJuntada | diaMes;
        <div class="fecha">
          <small>{{ fecha.mes }}</small>
          <strong>{{ fecha.dia }}</strong>
        </div>
        <div class="datos">
          <strong>{{ juntada.titulo }}</strong>
          <small>{{ juntada.zona }} · {{ hora(juntada) }}</small>
          <small class="cupo">{{ cupo(juntada) }}</small>
        </div>
      </article>
    } @empty {
      <p>No hay juntadas armadas todavía.</p>
    }
  </div>
</aside>

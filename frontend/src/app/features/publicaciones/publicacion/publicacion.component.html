<section class="detalle">
  <a class="volver" routerLink="/publicaciones">← Volver</a>
  @if (publicacion(); as publicacion) {
    <app-publicacion-card [publicacion]="publicacion" [detalleCompleto]="true" (eliminada)="volver()" />
    <app-comentarios [publicacionId]="publicacion._id" />
  } @else {
    <app-spinner />
  }
</section>

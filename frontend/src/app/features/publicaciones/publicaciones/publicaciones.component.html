<div class="escritorio">
  <app-mi-mesa />
  <section class="centro">
    <header class="encabezado">
      <h1>Juegos y juntadas</h1>
      <div class="controles">
        <select [value]="orden()" (change)="cambiarOrden($event)">
          <option value="fecha">Más recientes</option>
          <option value="meGusta">Más me gusta</option>
        </select>
        <select [value]="tipo()" (change)="cambiarTipo($event)">
          <option value="">Todos</option>
          <option value="juego">Juegos</option>
          <option value="juntada">Juntadas</option>
        </select>
        <input type="text" class="zona" placeholder="Filtrar por zona" (change)="cambiarZona($event)" />
        <button type="button" class="boton" (click)="mostrandoFormulario.set(true)">Nueva publicación</button>
      </div>
    </header>

    @for (publicacion of publicaciones(); track publicacion._id) {
      <app-publicacion-card [publicacion]="publicacion" (eliminada)="eliminada()" />
    } @empty {
      @if (!cargando()) {
        <p class="vacio">Todavía no hay publicaciones. ¡Compartí tu primer juego o armá una juntada!</p>
      }
    }

    @if (total() > 0) {
      <app-paginador [total]="total()" [offset]="offset()" [limit]="porPagina" (cambiado)="cargar($event)" />
    }
  </section>
  <app-proximas-juntadas />
</div>

@if (mostrandoFormulario()) {
  <app-nueva-publicacion (publicada)="publicada()" (cancelada)="mostrandoFormulario.set(false)" />
}
